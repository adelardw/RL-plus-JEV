[project]
name = "rljevf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "httpx>=0.28.1",
    "kaggle>=2.2.4",
    "matplotlib>=3.11.2",
    "peft>=0.21.0",
    "python-dotenv>=1.2.3",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "trl>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rljevf"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
